services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: valet
      POSTGRES_USER: valet
      POSTGRES_PASSWORD: valet
    volumes:
      - valet-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valet -d valet"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/valet
      DB_USERNAME: valet
      DB_PASSWORD: valet
      PUBLIC_BASE_URL: http://localhost:4200
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
volumes:
  valet-postgres:
