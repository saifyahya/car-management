<main class="login" [attr.dir]="langService.lang() === 'ar' ? 'rtl' : 'ltr'">
  <form (ngSubmit)="login()">
    <div class="top-bar">
      <button type="button" class="lang-btn" (click)="langService.toggleLang()">
        🌐 {{ langService.lang() === 'en' ? 'العربية' : 'English' }}
      </button>
    </div>

    <img src="/logo.jpg" alt="Valet Logo" class="login-logo" />
    <p style="color: #0d1016;">{{ langService.t('loginSub') }}</p>

    <label>
      {{ langService.t('lblUsername') }}
      <input name="username" [(ngModel)]="username" autocomplete="username" />
    </label>

    <label>
      {{ langService.t('lblPassword') }}
      <div class="password-input-wrapper">
        <input name="password" [type]="showPassword() ? 'text' : 'password'" [(ngModel)]="password" autocomplete="current-password" />
        <button type="button" class="toggle-password-btn" (click)="toggleShowPassword()" [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
          @if (showPassword()) {
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          }
        </button>
      </div>
    </label>

    @if (error()) {
      <div class="error">{{ error() }}</div>
    }

    <button type="submit">{{ langService.t('btnSignIn') }}</button>
  </form>
</main>
