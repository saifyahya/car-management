<app-page-header [title]="langService.t('checkInTitle')" [subtitle]="langService.t('checkInSub')"/><form (ngSubmit)="save()"><section><h2>{{ langService.t('secVisitor') }}</h2><div class="grid"><label>{{ langService.t('lblPhone') }}<input required name="phone" [(ngModel)]="model.visitorPhone" placeholder="+9627..."></label><label>{{ langService.t('lblPlate') }}<input required name="plate" [(ngModel)]="model.plateNumber"></label><label>{{ langService.t('lblMake') }}<input required name="make" [(ngModel)]="model.make"></label><label>{{ langService.t('lblModel') }}<input required name="model" [(ngModel)]="model.model"></label><label>{{ langService.t('lblColor') }}<input required name="color" [(ngModel)]="model.color"></label></div></section><section><h2>{{ langService.t('secParking') }}</h2><div class="grid"><label>{{ langService.t('lblParkingLoc') }}<input name="parking" [(ngModel)]="model.parkingLocation" placeholder="B2-18"></label><label>{{ langService.t('lblKeyLoc') }}<input name="key" [(ngModel)]="model.keyLocation" placeholder="Cabinet 2 / Hook 14"></label></div><label>{{ langService.t('lblNotes') }}<textarea name="notes" [(ngModel)]="model.notes" rows="4"></textarea></label></section><button [disabled]="saving()">{{saving()?langService.t('btnSaving'):langService.t('btnCreateTicket')}}</button></form>
