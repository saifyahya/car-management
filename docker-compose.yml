version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: valet_postgres
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-valet_db}
      POSTGRES_USER: ${DB_USER:-valet_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-valet_secret_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-valet_user} -d ${DB_NAME:-valet_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: valet_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-valet_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-valet_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-valet_secret_pass}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      SMS_PROVIDER: ${APP_SMS_PROVIDER:-mail}
      GMAIL_USERNAME: ${GMAIL_USERNAME}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_SMTP_AUTH: "true"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: valet_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
