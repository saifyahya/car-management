server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  h2:
    console:
      enabled: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:465}
    username: ${GMAIL_USERNAME:saifbarakat991@gmail.com}
    password: ${GMAIL_APP_PASSWORD:qtruhgoarbzgtihj}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          ssl:
            enable: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
          starttls:
            enable: false
  freemarker:
    template-loader-path: classpath:/templates/email/
    suffix: .ftlh
    charset: UTF-8
    cache: false
app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:4200}
  sms:
    provider: ${SMS_PROVIDER:mail} # Options: mail (default), twilio, log
  mail:
    from: ${GMAIL_USERNAME:saifbarakat991@gmail.com}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:YOUR_TWILIO_ACCOUNT_SID}
    auth-token: ${TWILIO_AUTH_TOKEN:YOUR_TWILIO_AUTH_TOKEN}
    from-number: ${TWILIO_FROM_NUMBER:YOUR_TWILIO_FROM_NUMBER}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
