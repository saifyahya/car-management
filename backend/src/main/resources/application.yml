server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:file:./data/valet;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:4200}
  twilio:
    enabled: ${TWILIO_ENABLED:false}
    account-sid: ${TWILIO_ACCOUNT_SID:YOUR_TWILIO_ACCOUNT_SID}
    auth-token: ${TWILIO_AUTH_TOKEN:YOUR_TWILIO_AUTH_TOKEN}
    from-number: ${TWILIO_FROM_NUMBER:YOUR_TWILIO_FROM_NUMBER}

